name: Build All Android APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git unzip wget curl \
            libltdl-dev libffi-dev libssl-dev python3-dev \
            zlib1g-dev libncurses5 libncurses5:i386 libstdc++6:i386

      - name: Setup Android SDK CommandLine Tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9441835_latest.zip -O commandlinetools.zip
          unzip -q commandlinetools.zip
          mv cmdline-tools latest
          rm commandlinetools.zip

      - name: Set Environment Variables
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$HOME/android-sdk || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      - name: Build APK for ARM7
        run: |
          cp buildozer-arm7.spec buildozer.spec
          yes | buildozer -v android debug

      - name: Build APK for ARM8
        run: |
          cp buildozer-arm8.spec buildozer.spec
          yes | buildozer -v android debug

      - name: Build APK for Universal
        run: |
          cp buildozer-universal.spec buildozer.spec
          yes | buildozer -v android debug

      - name: Upload All APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-apk-files
          path: bin/*.apk
