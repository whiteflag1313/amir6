name: Build 3 APKs (ARM8, ARM7, Universal)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [arm8, arm7, universal]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Setup buildozer.spec for ${{ matrix.arch }}
      run: |
        cp buildozer-${{ matrix.arch }}.spec buildozer.spec

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

    - name: Build APK
      timeout-minutes: 120
      env:
        CI: "true"
      run: |
        yes | buildozer -v android debug

    - name: Upload APK (${{ matrix.arch }})
      uses: actions/upload-artifact@v4
      with:
        name: AMIR6-${{ matrix.arch }}-APK
        path: bin/*.apk
        if-no-files-found: error
