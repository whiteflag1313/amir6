name: Build All APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git \
              zip \
              unzip \
              autoconf \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libltdl-dev \
              libffi-dev \
              libssl-dev \
              ant

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Configure Pre-installed Android SDK
        run: |
          # لینک کردن SDK پیش‌فرض گیت‌هاب به مسیر پیش‌فرض بیلدوزر
          sudo ln -s /usr/local/lib/android/sdk /home/runner/android-sdk
          sudo chmod -R 777 /home/runner/android-sdk
          
          # نصب و فعال‌سازی ابزارهای ضروری بیلد (build-tools و platform-tools حاوی aidl)
          export ANDROID_HOME=/home/runner/android-sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"

      - name: Create output directory
        run: mkdir -p final_apks

      - name: Build ARM7 APK
        run: |
          cp buildozer-arm7.spec buildozer.spec
          buildozer -v android debug
          cp bin/*.apk final_apks/app-arm7.apk || true

      - name: Build ARM8 APK
        run: |
          rm -rf bin/
          cp buildozer-arm8.spec buildozer.spec
          buildozer -v android debug
          cp bin/*.apk final_apks/app-arm8.apk || true

      - name: Build Universal APK
        run: |
          rm -rf bin/
          cp buildozer-universal.spec buildozer.spec
          buildozer -v android debug
          cp bin/*.apk final_apks/app-universal.apk || true

      - name: List built files
        run: |
          ls -la final_apks/

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-android-apks
          path: final_apks/*.apk
