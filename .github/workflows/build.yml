name: Build All Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          autoconf \
          libtool \
          pkg-config \
          libssl-dev \
          unzip \
          wget

    - name: Force Fix Android SDK & Buildozer Paths
      run: |
        # ساختن دقیق همون مسیری که بیلدوزر گدایی می‌کنه
        sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
        sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools/latest
        
        # دانلود commandlinetools و ریختن تو مسیر
        cd /tmp
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandlinetools.zip
        unzip -q commandlinetools.zip
        sudo mv cmdline-tools/* /usr/local/lib/android/sdk/cmdline-tools/latest/
        
        # کپی کردن ابزارها به مسیری که بیلدوزر خطا میده تا خفه بشه
        sudo ln -s /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
        
        # دسترسی کامل دادن
        sudo chmod -R 777 /usr/local/lib/android/sdk
        
        # اکسپورت متغیرها
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

    - name: Install Python Dependencies & Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade cython==0.29.36
        pip install --upgrade buildozer
        pip install --upgrade pillow

    - name: Build ARM7 APK
      run: |
        cp buildozer-arm7.spec buildozer.spec
        buildozer -v android debug

    - name: Build ARM8 APK
      run: |
        cp buildozer-arm8.spec buildozer.spec
        buildozer -v android debug

    - name: Build Universal APK
      run: |
        cp buildozer-universal.spec buildozer.spec
        buildozer -v android debug

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-amirah-apks
        path: bin/*.apk
