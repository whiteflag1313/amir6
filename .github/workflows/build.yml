
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      SDK_ROOT: /home/runner/android-sdk
      NDK_VERSION: 25.2.9519653
      ANDROID_API: "33"
      ANDROID_MIN_API: "21"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager)"
          echo "sdkmanager found at: $SDKMANAGER"

          echo "Accepting Android SDK licenses..."
          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "SDK license acceptance failed: $LICENSE_STATUS"
            exit "$LICENSE_STATUS"
          fi

          echo "Installing Android SDK components..."
          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          mkdir -p "$SDK_ROOT/tools/bin"

          cat > "$SDK_ROOT/tools/bin/sdkmanager" <<EOF
          #!/usr/bin/env bash
          exec "$SDKMANAGER" --sdk_root="$SDK_ROOT" "\$@"
          EOF

          chmod +x "$SDK_ROOT/tools/bin/sdkmanager"

          echo "$SDK_ROOT/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/33.0.2" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=$ANDROID_API" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=$ANDROID_MIN_API" >> "$GITHUB_ENV"

          test -x "$SDK_ROOT/tools/bin/sdkmanager"
          test -x "$SDK_ROOT/build-tools/33.0.2/aidl"
          test -d "$SDK_ROOT/platform-tools"
          test -d "$SDK_ROOT/platforms/android-33"
          test -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties"

          echo "Android SDK components installed and verified."

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            ant \
            build-essential \
            cmake

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            buildozer \
            cython==0.29.36 \
            virtualenv

      - name: Verify Android environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROIDNDK=$ANDROIDNDK"

          test "$ANDROID_HOME" = "$SDK_ROOT"
          test "$ANDROID_SDK_ROOT" = "$SDK_ROOT"
          test "$ANDROIDSDK" = "$SDK_ROOT"

          test "$ANDROID_NDK" = "$ANDROIDNDK"
          test "$ANDROID_NDK_HOME" = "$ANDROIDNDK"
          test "$ANDROID_NDK_ROOT" = "$ANDROIDNDK"

          test -x "$SDK_ROOT/tools/bin/sdkmanager"
          test -x "$SDK_ROOT/build-tools/33.0.2/aidl"
          test -d "$SDK_ROOT/platforms/android-33"
          test -f "$ANDROID_NDK/source.properties"

          echo "Checking sdkmanager..."
          command -v sdkmanager
          "$SDK_ROOT/tools/bin/sdkmanager" --list_installed

          echo "Checking Android SDK files..."
          ls -la "$SDK_ROOT"
          ls -la "$SDK_ROOT/tools/bin"
          ls -la "$SDK_ROOT/build-tools/33.0.2"

          cat "$ANDROID_NDK/source.properties"

      - name: Clear old build cache
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMIR6-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AMIR6-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
