name: Build Universal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Fix Android SDK Paths for Buildozer
      run: |
        sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33" "ndk;25.2.9519653"
        
        # ساخت دقیق مسیری که بیلدوزر دنبالش می‌گردد و لینک دادن به اندروید اصلی
        sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
        sudo ln -sfn /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
        mkdir -p ~/.buildozer/android/platform
        ln -sfn /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
        ln -sfn /usr/local/lib/android/sdk/ndk/25.2.9519653 ~/.buildozer/android/platform/android-ndk-r25c

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev aidl
        sudo wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2_amd64.deb

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer "cython==0.29.36"

    - name: Build APK
      timeout-minutes: 180
      env:
        CI: "true"
      run: |
        cp buildozer-universal.spec buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AMIR6-Universal-APK
        path: bin/*.apk
        if-no-files-found: error
