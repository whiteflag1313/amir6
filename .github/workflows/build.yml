name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64-v8a
          - armeabi-v7a
          - "arm64-v8a,armeabi-v7a"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache \
            openjdk-17-jdk-headless

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      - name: Set architecture
        run: |
          sed -i "s/^android.archs = .*/android.archs = ${{ matrix.arch }}/" buildozer.spec
          echo "Current arch setting:"
          grep "android.archs" buildozer.spec

      - name: Build APK
        run: |
          rm -rf .buildozer bin
          buildozer -v android debug

      - name: Prepare APK
        if: success()
        run: |
          ARCH="${{ matrix.arch }}"
          if [ "$ARCH" = "arm64-v8a,armeabi-v7a" ]; then
            NAME="universal"
          else
            NAME="$ARCH"
          fi
          mkdir -p output
          mv bin/*.apk "output/AMIR6-${NAME}.apk"
          ls -lh output/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AMIR6-${{ matrix.arch == 'arm64-v8a,armeabi-v7a' && 'universal' || matrix.arch }}
          path: output/*.apk
          retention-days: 7

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.arch }}
          path: |
            .buildozer/android/platform/build-*/build.log
            buildozer.spec
          if-no-files-found: ignore
          retention-days: 5
