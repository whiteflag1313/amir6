name: Build All APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git \
              zip \
              unzip \
              autoconf \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libltdl-dev \
              libffi-dev \
              libssl-dev \
              ant \
              build-essential \
              wget

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Setup Android SDK Manually (Fix Path)
        run: |
          ANDROID_HOME="/home/runner/android-sdk"
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          
          # انتقال صحیح فایل‌ها به ساختار مورد انتظار sdkmanager
          mv bin $ANDROID_HOME/cmdline-tools/latest/
          mv lib $ANDROID_HOME/cmdline-tools/latest/
          rm cmdline-tools.zip
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Create output directory
        run: mkdir -p final_apks

      - name: Build ARM7 APK
        run: |
          cp buildozer-arm7.spec buildozer.spec
          buildozer -v android debug
          cp bin/*.apk final_apks/app-arm7.apk || true

      - name: Build ARM8 APK
        run: |
          rm -rf bin/
          cp buildozer-arm8.spec buildozer.spec
          buildozer -v android debug
          cp bin/*.apk final_apks/app-arm8.apk || true

      - name: Build Universal APK
        run: |
          rm -rf bin/
          cp buildozer-universal.spec buildozer.spec
          buildozer -v android debug
          cp bin/*.apk final_apks/app-universal.apk || true

      - name: List built files
        run: |
          ls -la final_apks/

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-android-apks
          path: final_apks/*.apk
