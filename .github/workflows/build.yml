name: Build Universal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev
        sudo wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2_amd64.deb

    - name: Configure Android SDK for Buildozer
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        
        # نصب پکیج‌های لازم
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33" "ndk;25.2.9519653"
        
        # کپی کردن کل ابزارها به پوشه tools تا بیلدوزر و sdkmanager کرش نکنند
        sudo mkdir -p $ANDROID_HOME/tools
        sudo cp -r $ANDROID_HOME/cmdline-tools/latest/* $ANDROID_HOME/tools/
        
        # لینک دادن به مسیری که بیلدوزر دقیقا انتظار دارد
        mkdir -p ~/.buildozer/android/platform
        ln -sfn $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
        ln -sfn $ANDROID_HOME/ndk/25.2.9519653 ~/.buildozer/android/platform/android-ndk-r25c

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer "cython==0.29.36"

    - name: Build APK
      timeout-minutes: 180
      env:
        CI: "true"
      run: |
        cp buildozer-universal.spec buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AMIR6-Universal-APK
        path: bin/*.apk
        if-no-files-found: error
