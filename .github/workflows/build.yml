
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            name: arm64
          - arch: armeabi-v7a
            name: arm7
          - arch: arm64-v8a,armeabi-v7a
            name: universal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

      - name: Configure Android SDK paths
        run: |
          mkdir -p /home/runner
          if [ ! -e /home/runner/android-sdk ]; then
            ln -s "$ANDROID_HOME" /home/runner/android-sdk
          fi
          echo "ANDROIDSDK=/home/runner/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/home/runner/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=/home/runner/android-sdk/ndk/25.2.9519653" >> "$GITHUB_ENV"
          test -x /home/runner/android-sdk/build-tools/33.0.2/aidl
          /home/runner/android-sdk/build-tools/33.0.2/aidl --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libltdl-dev \
            libffi-dev libssl-dev ant \
            build-essential cmake

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Set target architecture
        run: |
          sed -i "s|^android.archs *=.*|android.archs = ${{ matrix.arch }}|" buildozer.spec
          grep '^android.archs' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMIR6-${{ matrix.name }}
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
