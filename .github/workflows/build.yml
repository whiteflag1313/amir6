name: Build All APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git \
              zip \
              unzip \
              autoconf \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libltdl-dev \
              libffi-dev \
              libssl-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Install Android SDK and Fix Java Environment
        uses: android-actions/setup-android@v3

      - name: Build ARM7 APK
        run: |
          buildozer -v --spec buildozer-arm7.spec android debug

      - name: Build ARM8 APK
        run: |
          buildozer -v --spec buildozer-arm8.spec android debug

      - name: Build Universal APK
        run: |
          buildozer -v --spec buildozer-universal.spec android debug

      - name: List built files
        run: |
          ls -la bin/

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-android-apks
          path: bin/*.apk
