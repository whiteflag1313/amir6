name: Build Amir6 APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    
    strategy:
      matrix:
        include:
          - arch: arm64-v8a
            suffix: arm64
          - arch: armeabi-v7a
            suffix: v7a
          - arch: arm64-v8a
            suffix: universal

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev libltdl-dev wget

    - name: Install Python packages
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Setup Android SDK
      run: |
        SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $SDK_DIR
        cd $SDK_DIR

        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip

        mkdir -p cmdline-tools
        if [ -d "cmdline-tools" ] && [ ! -d "cmdline-tools/latest" ]; then
          mv cmdline-tools cmdline-tools_temp 2>/dev/null || true
          mkdir -p cmdline-tools
          mv cmdline-tools_temp cmdline-tools/latest 2>/dev/null || true
        fi

        if [ ! -f "cmdline-tools/latest/bin/sdkmanager" ]; then
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          if [ -d "cmdline-tools/bin" ]; then
            mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          fi
        fi

        mkdir -p tools/bin
        if [ -f "cmdline-tools/latest/bin/sdkmanager" ]; then
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager tools/bin/sdkmanager
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/avdmanager tools/bin/avdmanager 2>/dev/null || true
          chmod +x tools/bin/sdkmanager
        fi

        export ANDROID_HOME=$SDK_DIR
        export PATH=$PATH:$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/tools/bin

        yes | sdkmanager --licenses || true
        yes | sdkmanager --licenses || true

        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653" || true

    - name: Update Architecture in buildozer.spec
      run: |
        ARCH_VAL="${{ matrix.arch }}"
        sed -i "s/^android.archs.*/android.archs = $ARCH_VAL/" buildozer.spec

    - name: Build APK
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools

        for dir in $ANDROID_HOME/build-tools/*; do
          if [ -d "$dir" ]; then
            export PATH=$PATH:$dir
            break
          fi
        done

        buildozer -v android debug

    - name: Rename and Prepare APK
      run: |
        mkdir -p final_apk
        cp bin/*.apk final_apk/amir6-${{ matrix.suffix }}.apk

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: amir6-${{ matrix.suffix }}
        path: final_apk/*.apk
        if-no-files-found: warn
