name: Build All Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          autoconf \
          libtool \
          pkg-config \
          libssl-dev \
          unzip \
          wget

    - name: Setup Android SDK Environment
      run: |
        mkdir -p $HOME/android/sdk
        cd $HOME/android/sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/latest/
        mv cmdline-tools/lib cmdline-tools/latest/
        rm tools.zip

        # Accept licenses automatically
        yes | $HOME/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android/sdk --licenses

        # Export paths globally for buildozer
        echo "ANDROID_HOME=$HOME/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android/sdk" >> $GITHUB_ENV
        echo "$HOME/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android/sdk/platform-tools" >> $GITHUB_PATH

    - name: Install Python Dependencies & Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade cython==0.29.36
        pip install --upgrade buildozer
        pip install --upgrade pillow

    - name: Build ARM7 APK
      run: |
        cp buildozer-arm7.spec buildozer.spec
        buildozer -v android debug

    - name: Build ARM8 APK
      run: |
        cp buildozer-arm8.spec buildozer.spec
        buildozer -v android debug

    - name: Build Universal APK
      run: |
        cp buildozer-universal.spec buildozer.spec
        buildozer -v android debug

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-amirah-apks
        path: bin/*.apk
