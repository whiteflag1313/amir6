name: Build All Android APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git unzip wget curl \
            libltdl-dev libffi-dev libssl-dev python3-dev \
            zlib1g-dev libncurses5 libncurses5:i386 libstdc++6:i386

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      - name: Build APK for ARM7
        run: |
          yes | buildozer -v -c buildozer-arm7.spec android debug

      - name: Build APK for ARM8
        run: |
          yes | buildozer -v -c buildozer-arm8.spec android debug

      - name: Build APK for Universal
        run: |
          yes | buildozer -v -c buildozer-universal.spec android debug

      - name: Upload All APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-apk-files
          path: bin/*.apk
