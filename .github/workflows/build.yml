    - name: Build ARM7 APK
      run: |
        cp buildozer-arm7.spec buildozer.spec
        # تزریق مستقیم مسیر SDK به فایل spec در حین اجرا
        echo "android.sdk_path = $HOME/android/sdk" >> buildozer.spec
        echo "android.skip_update = False" >> buildozer.spec
        buildozer -v android debug

    - name: Build ARM8 APK
      run: |
        cp buildozer-arm8.spec buildozer.spec
        echo "android.sdk_path = $HOME/android/sdk" >> buildozer.spec
        echo "android.skip_update = False" >> buildozer.spec
        buildozer -v android debug

    - name: Build Universal APK
      run: |
        cp buildozer-universal.spec buildozer.spec
        echo "android.sdk_path = $HOME/android/sdk" >> buildozer.spec
        echo "android.skip_update = False" >> buildozer.spec
        buildozer -v android debug
