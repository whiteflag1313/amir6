name: Build Universal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev aidl
        wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2_amd64.deb

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer "cython==0.29.36"

    - name: Manually Setup Android SDK & NDK
      run: |
        # ۱. ساخت دقیق پوشه‌ای که بیلدوزر دنبالش می‌گردد
        export SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        
        # ۲. دانلود مستقیم ابزارهای گوگل
        cd "$SDK_DIR"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip -d cmdline-tools
        mv cmdline-tools/cmdline-tools cmdline-tools/latest
        rm commandlinetools-linux-9477386_latest.zip
        
        # ۳. ساختن پوشه tools تا بیلدوزر گمراه نشود
        mkdir -p "$SDK_DIR/tools"
        ln -sfn "$SDK_DIR/cmdline-tools/latest/bin" "$SDK_DIR/tools/bin"
        
        # ۴. نصب پکیج‌های اندروید و قبول لایسنس‌ها
        export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33" "ndk;25.2.9519653"
        
        # ۵. ساخت پوشه NDK مورد نظر بیلدوزر
        ln -sfn "$SDK_DIR/ndk/25.2.9519653" "$HOME/.buildozer/android/platform/android-ndk-r25c"

    - name: Build APK
      timeout-minutes: 180
      env:
        CI: "true"
      run: |
        cp buildozer-universal.spec buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AMIR6-Universal-APK
        path: bin/*.apk
        if-no-files-found: error
