name: Build All APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p final_apks

      - name: Build ARM7 APK
        uses: rtfd/buildozer-action@vlatest
        with:
          command: |
            cp buildozer-arm7.spec buildozer.spec
            buildozer -v android debug
            cp bin/*.apk final_apks/app-arm7.apk || true

      - name: Build ARM8 APK
        uses: rtfd/buildozer-action@vlatest
        with:
          command: |
            cp buildozer-arm8.spec buildozer.spec
            buildozer -v android debug
            cp bin/*.apk final_apks/app-arm8.apk || true

      - name: Build Universal APK
        uses: rtfd/buildozer-action@vlatest
        with:
          command: |
            cp buildozer-universal.spec buildozer.spec
            buildozer -v android debug
            cp bin/*.apk final_apks/app-universal.apk || true

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-android-apks
          path: final_apks/*.apk
