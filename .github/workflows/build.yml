name: Build 3 APKs (ARM8, ARM7, Universal)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm8, arm7, universal]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup buildozer.spec for ${{ matrix.arch }}
      run: |
        cp buildozer-${{ matrix.arch }}.spec buildozer.spec

    - name: Build APK with Docker
      timeout-minutes: 120
      run: |
        docker run --rm \
          --volume "${{ github.workspace }}":/home/user/hostcwd \
          --workdir /home/user/hostcwd \
          --entrypoint sh \
          kivy/buildozer:latest \
          -c "yes | buildozer -v android debug"

    - name: Upload APK (${{ matrix.arch }})
      uses: actions/upload-artifact@v4
      with:
        name: AMIR6-${{ matrix.arch }}-APK
        path: bin/*.apk
        if-no-files-found: error
