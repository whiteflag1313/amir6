name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 80

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev libltdl-dev wget

    - name: Install Python packages
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Setup Android SDK (compatible with Buildozer)
      run: |
        # Create Buildozer expected path
        mkdir -p $HOME/.buildozer/android/platform/android-sdk
        cd $HOME/.buildozer/android/platform/android-sdk

        # Download commandlinetools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip

        # Create the structure Buildozer expects
        mkdir -p cmdline-tools
        mv cmdline-tools latest
        mv latest cmdline-tools/

        # Create old-style tools folder that Buildozer looks for
        mkdir -p tools/bin
        ln -s $PWD/cmdline-tools/latest/bin/sdkmanager tools/bin/sdkmanager
        ln -s $PWD/cmdline-tools/latest/bin/avdmanager tools/bin/avdmanager || true

        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin

        # Accept licenses
        yes | sdkmanager --licenses || true
        yes | sdkmanager --licenses || true

        # Install packages
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653" || true

        echo "=== Checking structure ==="
        ls -la $ANDROID_HOME/tools/bin/ || true
        ls -la $ANDROID_HOME/build-tools/ || true

    - name: Build APK
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools

        for dir in $ANDROID_HOME/build-tools/*; do
          if [ -d "$dir" ]; then
            export PATH=$PATH:$dir
            echo "Using build-tools: $dir"
            break
          fi
        done

        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: amir6-apk
        path: bin/*.apk
        if-no-files-found: warn
