name: Build All APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip wget curl \
          libltdl-dev libffi-dev libssl-dev python3-dev zlib1g-dev \
          libncurses5 libncurses5:i386 libstdc++6:i386

    - name: Install Python packages
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36 pillow

    - name: Install Android SDK and Build-Tools manually
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
        unzip -q cmdtools.zip
        mv cmdline-tools latest
        mkdir -p cmdline-tools
        mv latest cmdline-tools/

        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin

        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
        sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

    - name: Build ARM7 APK
      run: |
        cp buildozer-arm7.spec buildozer.spec
        buildozer -v android debug

    - name: Build ARM8 APK
      run: |
        cp buildozer-arm8.spec buildozer.spec
        buildozer -v android debug

    - name: Build Universal APK
      run: |
        cp buildozer-universal.spec buildozer.spec
        buildozer -v android debug

    - name: List built files
      if: always()
      run: |
        echo "=== Content of bin/ ==="
        ls -la bin/ || true
        find . -name "*.apk" || true

    - name: Upload All APKs
      uses: actions/upload-artifact@v4
      with:
        name: all-amir6-apks
        path: bin/*.apk
        if-no-files-found: warn
