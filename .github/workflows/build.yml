
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK in Buildozer path
        run: |
          export SDK_ROOT=/home/runner/android-sdk
          mkdir -p "$SDK_ROOT"

          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses

          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=21" >> "$GITHUB_ENV"

          test -x "$SDK_ROOT/build-tools/33.0.2/aidl"
          test -d "$SDK_ROOT/platforms/android-33"
          test -d "$SDK_ROOT/ndk/25.2.9519653"

          echo "Android SDK installation verified."
          ls -la "$SDK_ROOT/build-tools/33.0.2"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            ant \
            build-essential \
            cmake

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Verify Buildozer configuration
        run: |
          grep -E '^(android.sdk_path|android.ndk_path|android.api|android.minapi|android.ndk|android.archs|android.skip_update)' buildozer.spec

          test -x /home/runner/android-sdk/build-tools/33.0.2/aidl
          test -d /home/runner/android-sdk/platforms/android-33
          test -d /home/runner/android-sdk/ndk/25.2.9519653

      - name: Clean previous build
        run: |
          buildozer android clean || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMIR6-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
